name: quality-and-container

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked environment
        run: python -m venv .venv && make install-dev
      - name: Build pinned source reports
        run: make fetch build
      - name: Validate code and artifacts
        run: make verify test quality check-deps
      - name: Build API container
        run: docker build -t ai4i-predictive-maintenance-audit .
      - name: Check container API
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name ai4i-audit -p 8000:8000 ai4i-predictive-maintenance-audit
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              docker logs ai4i-audit || true
            fi
            docker stop ai4i-audit >/dev/null 2>&1 || true
            exit "$result"
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8000/health \
            | python -c 'import json, sys; assert json.load(sys.stdin).get("status") == "ok"'
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8000/summary \
            | python -c 'import json, sys; assert json.load(sys.stdin)'
